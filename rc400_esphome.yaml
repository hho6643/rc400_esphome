# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: rc400-receiver
  friendly_name: RC400 Receiver
  area: Kitchen


esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG


ota:
  - platform: esphome
    password: !secret fireplace_remote__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal:

switch:
  - platform: gpio
    id: rc400_antenna_switch
    pin: GPIO38
    restore_mode: ALWAYS_ON
    internal: true  
    
spi:
  - id: spi_1
    clk_pin: GPIO7
    miso_pin: GPIO8
    mosi_pin: GPIO9

sx126x:
  - id: sx126x_1
    spi_id: spi_1
    hw_version: sx1262
    busy_pin: GPIO40
    cs_pin: GPIO41
    dio1_pin: GPIO39
    rst_pin: GPIO42    
   
    modulation: FSK
    frequency: 913.2MHz
    bitrate: 25000
    deviation: 50kHz
    bandwidth: 234_3kHz
  
    sync_value: [0x2D, 0xD4]
    payload_length: 25
    preamble_size: 8
    preamble_detect: 2
  
    crc_enable: false
    whitening_enable: false
    rx_start: true


    # Requires board-specific confirmation:
    rf_switch: false
    tcxo_voltage: 2_4V
    tcxo_delay: 5ms


    on_packet:
      then:
        - lambda: |-
            ESP_LOGI("rc400", "Received %u bytes, RSSI %.1f dBm: %s",
                     (unsigned int) x.size(),
                     rssi,
                     format_hex(x).c_str());
