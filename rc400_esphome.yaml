substitutions:
  # Override in your main YAML or point at an HA template sensor.
  rc400_external_temperature_entity: sensor.rc400_external_temperature
  rc400_frequency: "913.2MHz"
  rc400_frequency_hz: "913200000"
  rc400_remote_address: "00 00 A1 AF"
  rc400_fireplace_address: "15 57 FE BD"


esphome:
  name: rc400-receiver
  friendly_name: RC400 Receiver
  includes:
    - rc400_protocol.h
    - rc400_state.h

# configured for Seeed Studio XIAO ESP32-S3 + Wio-SX1262 Kit (SKU 113110064), customize as you need to
esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO
  
ota:
  - platform: esphome
    encryption:
    id: ota_esphome_1  

# add your own secret key here
api:
  encryption:
    key: !secret rc400_receiver__encryption_key

# add your own wifi SSID & password here
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Seeed Studio XIAO ESP32-S3 + Wio-SX1262 Kit (SKU 113110064) configuration

spi:
  - id: spi_1
    clk_pin: GPIO7
    miso_pin: GPIO8
    mosi_pin: GPIO9

sx126x:
  - id: sx126x_1
    spi_id: spi_1
    hw_version: sx1262
    busy_pin: GPIO40
    cs_pin: GPIO41
    dio1_pin: GPIO39
    rst_pin: GPIO42
    rf_switch: true
    tcxo_voltage: 2_4V
    tcxo_delay: 5ms
  
    modulation: FSK
    frequency: ${rc400_frequency}
    bitrate: 25000
    deviation: 50kHz
    bandwidth: 234_3kHz
  
    sync_value: [0x2D, 0xD4]
    payload_length: 25
    preamble_size: 8
    preamble_detect: 2
  
    crc_enable: false
    whitening_enable: false
    rx_start: true

    # code that drives most of the RC400 functionality, including the fireplace state machine and command encoding
    on_packet:
      then:
        - lambda: |-
            // Seek packets are handled independently of configured addresses.
            // Never update normal fireplace state while the receiver is scanning.
            if (id(rc400_seek_active)) {
              if (!rc400::valid_packet(x)) return;
              const int ch = id(rc400_seek_channel);
              char addr[12], dest[12];
              snprintf(addr, sizeof(addr), "%02X %02X %02X %02X",
                       x[1], x[2], x[3], x[4]);
              snprintf(dest, sizeof(dest), "%02X %02X %02X %02X",
                       x[5], x[6], x[7], x[8]);
              if (x[9] == 0x9A && x[10] == 0x0E &&
                  x[5] == 0xFF && x[6] == 0xFF &&
                  x[7] == 0xFF && x[8] == 0xFF) {
                ESP_LOGI("rc400_seek", "Fireplace candidate: channel %d, %s, RSSI %.1f",
                         ch, addr, rssi);
                // Choose strongest valid fireplace packet across all channels.
                if (id(rc400_seek_phase) == 1 &&
                    rssi > id(rc400_seek_best_rssi)) {
                  id(rc400_seek_best_rssi) = rssi;
                  id(rc400_seek_best_channel) = ch;
                  id(rc400_seek_fireplace_addr) = addr;
                  id(rc400_seek_fireplace_hex) =
                      (uint32_t(x[1]) << 24) | (uint32_t(x[2]) << 16) |
                      (uint32_t(x[3]) << 8) | uint32_t(x[4]);
                  id(rc400_seek_found_fireplace) = true;
                  if (id(rc400_seek_remote_dest_hex) != id(rc400_seek_fireplace_hex)) {
                    id(rc400_seek_remote_addr).clear();
                    id(rc400_seek_remote_address).publish_state("Not discovered");
                  }
                  id(rc400_seek_fireplace_address).publish_state(addr);
                  id(rc400_seek_channel_sensor).publish_state(ch);
                  id(rc400_seek_frequency_sensor).publish_state(912.0f + ch * 0.2f);
                }
              } else if ((x[9] == 0x26 && x[10] == 0x0A) ||
                         (x[0] == 0x03 && x[10] == 0x05 &&
                          (x[9] == 0x09 || x[9] == 0x0A ||
                           x[9] == 0x10 || x[9] == 0x22 ||
                           x[9] == 0x25))) {
                ESP_LOGI("rc400_seek", "Remote packet candidate: channel %d, %s -> %s",
                         ch, addr, dest);
                // Save a remote candidate only if its destination is the
                // currently selected fireplace (or defer matching until later).
                const uint32_t remote_dest =
                    (uint32_t(x[5]) << 24) | (uint32_t(x[6]) << 16) |
                    (uint32_t(x[7]) << 8) | uint32_t(x[8]);
                if (id(rc400_seek_found_fireplace) &&
                    remote_dest == id(rc400_seek_fireplace_hex) &&
                    (id(rc400_seek_phase) == 2 ||
                     ch == id(rc400_seek_best_channel))) {
                  id(rc400_seek_remote_addr) = addr;
                  id(rc400_seek_remote_dest_hex) = remote_dest;
                  id(rc400_seek_remote_address).publish_state(addr);
                  if (id(rc400_seek_phase) == 2) {
                    id(rc400_seek_active) = false;
                    id(rc400_seek_phase) = 0;
                    id(sx126x_1)->set_frequency(static_cast<uint32_t>(${rc400_frequency_hz}));
                    id(sx126x_1)->configure();
                    id(sx126x_1)->set_mode_rx();
                    id(rc400_seek_status).publish_state("Complete - remote found");
                    ESP_LOGI("rc400_seek", "Remote %s matched fireplace %s; restored receiver",
                             addr, id(rc400_seek_fireplace_addr).c_str());
                  }
                }
              }
              return;
            }
            if (x.size() != rc400::kPacketLength) {
              ESP_LOGW("rc400", "Wrong packet length: %u", (unsigned) x.size());
              return;
            }
            if (x[24] != rc400::kTerminator) {
              ESP_LOGW("rc400", "Invalid terminator");
              return;
            }
            if (!rc400::valid_packet(x)) {
              ESP_LOGW("rc400", "Checksum mismatch");
              return;
            }

            // Room temperature report transmitted by the RC400 remote.
            // Message type 0x26, temperature in degrees Celsius at x[11].
            if (rc400::remote_temperature_report(x,id(rc400_config_remote),id(rc400_config_fireplace))) {

                if (!id(rc400_remote_room_temperature).has_state() ||
                    id(rc400_remote_room_temperature).state != x[11])
                  id(rc400_remote_room_temperature).publish_state(x[11]);
                if (id(rc400_temperature_source).current_option() == "RC400 Remote" &&
                    (!id(rc400_room_temperature).has_state() ||
                     id(rc400_room_temperature).state != x[11]))
                  id(rc400_room_temperature).publish_state(x[11]);

                auto now = id(rc400_clock).now();

                if (now.is_valid()) {
                  ESP_LOGI("rc400_temp",
                          "Time: %s | Byte 18: 0x%02X (%u)",
                          now.strftime("%H:%M:%S").c_str(),
                          x[18], x[18]);
                } else {
                  ESP_LOGI("rc400_temp",
                          "Time unavailable | Byte 18: 0x%02X (%u)",
                          x[18], x[18]);
                }

                return;
            }

            // Fireplace source address and broadcast destination.
            if (!rc400::fireplace_broadcast(x, id(rc400_config_fireplace))) {

              return;
            }

            id(rc400_last_broadcast_ms) = millis();


            const bool thermostat_on = x[11] != 0;
            const auto desired_mode = thermostat_on
                ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF;
            bool climate_changed = id(rc400_climate).mode != desired_mode;
            if (climate_changed)
              id(rc400_climate).set_mode(desired_mode);

            if (thermostat_on) {
              if (id(rc400_saved_thermostat_c) != x[11])
                id(rc400_saved_thermostat_c) = x[11];
              if (id(rc400_climate).target_temperature != x[11]) {
                id(rc400_climate).target_temperature = x[11];
                climate_changed = true;
              }
            }
            if (climate_changed)
              id(rc400_climate).publish_state();

            rc400::publish_sensor_if_changed(id(rc400_flame), x[12]);
            rc400::publish_binary_if_changed(id(rc400_fireplace_status), x[12] > 0);
            rc400::publish_switch_if_changed(id(rc400_cold_climate_control),
                                             x[13] != 0);
            rc400::publish_sensor_if_changed(id(rc400_fan), x[14]);
            rc400::publish_binary_if_changed(id(rc400_hot), x[18] != 0);
            rc400::publish_sensor_if_changed(id(rc400_operating_raw), x[19]);
            rc400::publish_sensor_if_changed(id(rc400_timer), x[20]);
            rc400::publish_binary_if_changed(id(rc400_timer_is_set), x[20] != 0);
            rc400::publish_number_if_changed(id(rc400_timer_control), x[20]);
            rc400::publish_sensor_if_changed(id(rc400_rssi), rssi);
            rc400::publish_binary_if_changed(id(rc400_receiving), true);

            // Fan startup wait: supported by this capture.
            rc400::publish_binary_if_changed(id(rc400_fan_waiting),
                           x[19] == 0x06 && x[14] > 0);

            // Stateful physical fan inference (existing cooldown heuristic).
            rc400::update_fan_state(id(rc400_fan_running_state),
                                    id(rc400_fan_cooldown_complete),
                                    x[12], x[14], x[19]);

            // Publish only when a state is established.
            if (id(rc400_fan_running_state) >= 0) {
              rc400::publish_binary_if_changed(id(rc400_fan_running),
                             id(rc400_fan_running_state) == 1);
            } else {
              if (id(rc400_fan_running).has_state())
                id(rc400_fan_running).invalidate_state();
            }


            if (x[14] <= 4) {
              const char *fan_options[] = {
                "Off", "Level 1", "Level 2", "Level 3", "Level 4"
              };

              rc400::publish_select_if_changed(id(rc400_fan_control),
                                               fan_options[x[14]]);
            }

            if (x[12] >= 1 && x[12] <= 5) {
              const char *flame_options[] = {
                "Level 1", "Level 2", "Level 3",
                "Level 4", "Level 5"
              };

              rc400::publish_select_if_changed(id(rc400_flame_control),
                                               flame_options[x[12] - 1]);
            }



            ESP_LOGD("rc400",
                     "Broadcast: flame=%u fan=%u "
                     "setpoint=%uC cold=%u hot=%u "
                     "timer=%u status=0x%02X RSSI=%.1f",
                     x[12], x[14], x[11], x[13],
                     x[18], x[20], x[19], rssi);

# Home Assistant package configuration for the RC400 ESPHome integration.

switch:  
  - platform: gpio
    # needed this for the antenna switch to work on the Seeed Studio XIAO ESP32-S3 + Wio-SX1262 Kit (SKU 113110064)
    name: "SX1262 Antenna Switch"
    id: sx1262_antenna_switch
    pin: GPIO38
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    name: "Cold Climate Pilot Control"
    id: rc400_cold_climate_control
    icon: mdi:candle
    optimistic: false

    turn_on_action:
      - script.execute:
          id: rc400_send_command
          command: 0x09
          value: 1

    turn_off_action:
      - script.execute:
          id: rc400_send_command
          command: 0x09
          value: 0

globals:
  # 0 = idle, 1 = frequency sweep, 2 = remote discovery
  - id: rc400_seek_phase
    type: int
    restore_value: no
    initial_value: '0'
  - id: rc400_seek_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: rc400_seek_channel
    type: int
    restore_value: no
    initial_value: '0'
  - id: rc400_seek_channel_started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: rc400_seek_best_channel
    type: int
    restore_value: no
    initial_value: '0'
  - id: rc400_seek_best_rssi
    type: float
    restore_value: no
    initial_value: '-1000.0f'
  - id: rc400_seek_found_fireplace
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: rc400_seek_fireplace_addr
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: rc400_seek_fireplace_hex
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: rc400_seek_remote_addr
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: rc400_seek_remote_dest_hex
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: rc400_last_broadcast_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: rc400_saved_thermostat_c
    type: int
    restore_value: true
    initial_value: '22'

  # Last inferred physical fan state:
  # -1 = Unknown, 0 = Stopped, 1 = Running
  - id: rc400_fan_running_state
    type: int
    restore_value: no
    initial_value: '-1'

  # Latches true once the fan has stopped during
  # an OFF cycle. Prevents speed changes from
  # falsely indicating that the fan restarted.
  - id: rc400_fan_cooldown_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: rc400_config_remote
    type: rc400::Address
    restore_value: no
    initial_value: 'rc400::parse_address("${rc400_remote_address}")'

  - id: rc400_config_fireplace
    type: rc400::Address
    restore_value: no
    initial_value: 'rc400::parse_address("${rc400_fireplace_address}")'


time:
  - platform: homeassistant
    id: rc400_clock


button:
  - platform: template
    name: "RC400 Start Seek"
    id: rc400_seek_button
    icon: mdi:radar
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return !id(rc400_seek_active);'
          then:
            - script.stop: rc400_send_command
            - lambda: |-
                id(rc400_seek_active) = true;
                id(rc400_seek_phase) = 1;
                id(rc400_seek_channel) = 1;
                id(rc400_seek_channel_started) = millis();
                id(rc400_seek_best_channel) = 0;
                id(rc400_seek_best_rssi) = -1000.0f;
                id(rc400_seek_found_fireplace) = false;
                id(rc400_seek_fireplace_addr).clear();
                id(rc400_seek_fireplace_hex) = 0;
                id(rc400_seek_remote_addr).clear();
                id(rc400_seek_remote_dest_hex) = 0;
                id(rc400_seek_status).publish_state("Scanning channel 1 of 30");
                id(rc400_seek_fireplace_address).publish_state("Not discovered");
                id(rc400_seek_remote_address).publish_state("Not discovered");
                id(rc400_seek_channel_sensor).publish_state(NAN);
                id(rc400_seek_frequency_sensor).publish_state(NAN);
                id(sx126x_1)->set_frequency(912200000UL);
                id(sx126x_1)->configure();
                id(sx126x_1)->set_mode_rx();
                ESP_LOGI("rc400_seek", "Seek started: channels 1-30, 5 seconds/channel");

  - platform: template
    name: "RC400 Stop Seek"
    id: rc400_seek_stop_button
    icon: mdi:stop
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return id(rc400_seek_active);'
          then:
            - lambda: |-
                id(rc400_seek_active) = false;
                id(rc400_seek_phase) = 0;
                id(sx126x_1)->set_frequency(static_cast<uint32_t>(${rc400_frequency_hz}));
                id(sx126x_1)->configure();
                id(sx126x_1)->set_mode_rx();
                id(rc400_seek_status).publish_state("Cancelled");
                ESP_LOGI("rc400_seek", "Seek cancelled; restored configured frequency");

  - platform: template
    name: "Fireplace Power"
    id: rc400_power_button
    icon: mdi:power
    on_press:
      - if:
          condition:
            lambda: |-
              return id(rc400_receiving).state &&
                     id(rc400_fireplace_status).has_state();
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x0B
                value: !lambda |-
                  return id(rc400_fireplace_status).state ? 0 : 1;
          else:
            - logger.log:
                level: WARN
                format: "Cannot toggle: fireplace status unavailable"


select:
  - platform: template
    name: "Temperature Source"
    id: rc400_temperature_source
    icon: mdi:thermometer-auto
    optimistic: true
    restore_value: true
    initial_option: "RC400 Remote"
    options:
      - "RC400 Remote"
      - "External Sensor"
    on_value:
      then:
        - lambda: |-
            esphome::sensor::Sensor *source =
                (x == "RC400 Remote")
                    ? static_cast<esphome::sensor::Sensor *>(
                          id(rc400_remote_room_temperature))
                    : static_cast<esphome::sensor::Sensor *>(
                          id(rc400_external_temperature));
            if (source->has_state() && !isnan(source->state)) {
              if (!id(rc400_room_temperature).has_state() ||
                  id(rc400_room_temperature).state != source->state)
                id(rc400_room_temperature).publish_state(source->state);
            } else {
              id(rc400_room_temperature).publish_state(NAN);
            }

  - platform: template
    name: "Fan Speed Control"
    id: rc400_fan_control
    icon: mdi:fan
    optimistic: false
    options:
      - "Off"
      - "Level 1"
      - "Level 2"
      - "Level 3"
      - "Level 4"

    set_action:
      - if:
          condition:
            binary_sensor.is_on: rc400_receiving
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x10
                value: !lambda |-
                  if (x == "Off") return 0;
                  if (x == "Level 1") return 1;
                  if (x == "Level 2") return 2;
                  if (x == "Level 3") return 3;
                  if (x == "Level 4") return 4;
                  return -1;
          else:
            - logger.log:
                level: WARN
                format: "Cannot set fan: fireplace broadcasts unavailable"

  - platform: template
    name: "Flame Level Control"
    id: rc400_flame_control
    icon: mdi:fire
    optimistic: false
    options:
      - "Level 1"
      - "Level 2"
      - "Level 3"
      - "Level 4"
      - "Level 5"

    set_action:
      - if:
          condition:
            lambda: |-
              return id(rc400_receiving).state &&
                     id(rc400_fireplace_status).has_state() &&
                     id(rc400_fireplace_status).state;
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x0A
                value: !lambda |-
                  if (x == "Level 1") return 1;
                  if (x == "Level 2") return 2;
                  if (x == "Level 3") return 3;
                  if (x == "Level 4") return 4;
                  if (x == "Level 5") return 5;
                  return -1;
          else:
            - logger.log:
                level: WARN
                format: "Cannot set flame: fireplace is off or status unavailable"

number:
  - platform: template
    name: "Fireplace Timer"
    id: rc400_timer_control
    icon: mdi:timer-outline
    unit_of_measurement: "min"
    min_value: 0
    max_value: 180
    step: 1
    mode: box
    optimistic: false

    set_action:
      - if:
          condition:
            lambda: |-
              return id(rc400_receiving).state &&
                     id(rc400_fireplace_status).has_state() &&
                     id(rc400_fireplace_status).state;
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x22
                value: !lambda |-
                  return static_cast<int>(x);
          else:
            - logger.log:
                level: WARN
                format: "Cannot set timer: fireplace is off or status unavailable"



sensor:
  - platform: template
    name: "RC400 Seek Channel"
    id: rc400_seek_channel_sensor
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "RC400 Seek Frequency"
    id: rc400_seek_frequency_sensor
    entity_category: diagnostic
    unit_of_measurement: "MHz"
    accuracy_decimals: 1

  # Read a Home Assistant entity (or a template combining multiple sensors).
  - platform: homeassistant
    id: rc400_external_temperature
    entity_id: ${rc400_external_temperature_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(rc400_temperature_source).current_option() == "External Sensor" &&
                !isnan(x) &&
                (!id(rc400_room_temperature).has_state() ||
                 id(rc400_room_temperature).state != x))
              id(rc400_room_temperature).publish_state(x);

  - platform: template
    name: "Room Temperature"
    id: rc400_room_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:home-thermometer


  - platform: template
    name: "Flame Level"
    id: rc400_flame
    icon: mdi:fire
    accuracy_decimals: 0

  - platform: template
    name: "Fan Speed Setting"
    id: rc400_fan
    icon: mdi:fan
    accuracy_decimals: 0

  - platform: template
    name: "Remote Room Temperature"
    id: rc400_remote_room_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    accuracy_decimals: 0

  - platform: template
    name: "Timer Remaining"
    id: rc400_timer
    unit_of_measurement: "min"
    icon: mdi:timer
    accuracy_decimals: 0

  - platform: template
    name: "Operating Status Raw"
    id: rc400_operating_raw
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "RSSI"
    id: rc400_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    icon: mdi:wifi-strength-1
    accuracy_decimals: 1


text_sensor:
  - platform: template
    name: "RC400 Seek Status"
    id: rc400_seek_status
    entity_category: diagnostic

  - platform: template
    name: "RC400 Seek Fireplace Address"
    id: rc400_seek_fireplace_address
    entity_category: diagnostic

  - platform: template
    name: "RC400 Seek Remote Address"
    id: rc400_seek_remote_address
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Fireplace Status"
    id: rc400_fireplace_status
    icon: mdi:fireplace

  - platform: template
    name: "Unit is Hot"
    id: rc400_hot
    icon: mdi:thermometer-alert

  - platform: template
    name: "Timer Is Set"
    id: rc400_timer_is_set
    icon: mdi:timer-check


  - platform: template
    name: "Receiving Broadcasts"
    id: rc400_receiving

  - platform: template
    name: "Fan Waiting to Start"
    id: rc400_fan_waiting
    icon: mdi:fan-alert

  - platform: template
    name: "Fan Running"
    id: rc400_fan_running
    icon: mdi:fan

climate:
  - platform: template
    name: "Fireplace Thermostat"
    id: rc400_climate
    optimistic: false
    restore_mode: NO_RESTORE

    sensor: rc400_room_temperature

    supported_modes:
      - "OFF"
      - HEAT

    visual:
      min_temperature: 6
      max_temperature: 26
      temperature_step: 1

    initial_state:
      mode: "OFF"
      target_temperature: 22

    set_mode_action:
      - if:
          condition:
            binary_sensor.is_on: rc400_receiving
          then:
            - if:
                condition:
                  lambda: |-
                    return x == climate::CLIMATE_MODE_HEAT;
                then:
                  - script.execute:
                      id: rc400_send_command
                      command: 0x25
                      value: !lambda |-
                        return std::max(6, std::min(26,
                          id(rc400_saved_thermostat_c)));
                else:
                  - script.execute:
                      id: rc400_send_command
                      command: 0x25
                      value: 0

    set_target_temperature_action:
      - lambda: |-
          const int requested = std::max(6, std::min(26,
              static_cast<int>(roundf(x))));
          id(rc400_saved_thermostat_c) = requested;

          if (id(rc400_climate).mode ==
              climate::CLIMATE_MODE_OFF) {
            id(rc400_climate).target_temperature = requested;
            id(rc400_climate).publish_state();
          }

      - if:
          condition:
            lambda: |-
              return id(rc400_receiving).state &&
                     id(rc400_climate).mode ==
                         climate::CLIMATE_MODE_HEAT;
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x25
                value: !lambda |-
                  return id(rc400_saved_thermostat_c);


script:
  - id: rc400_send_command
    mode: queued
    parameters:
      command: int
      value: int
    then:
      - if:
          condition:
            lambda: |-
              return !id(rc400_seek_active) && rc400::is_valid_command(command, value);
          then:
            - logger.log:
                format: "RC400: Command 0x%02X, value %d"
                args: ['command', 'value']

            - repeat:
                count: 2
                then:

 
                  - if:
                      condition:
                        lambda: 'return !id(rc400_seek_active);'
                      then:
                        - sx126x.send_packet:
                            id: sx126x_1
                            data: !lambda |-
                              // default to 0 if we don't have a valid minute
                              const auto now = id(rc400_clock).now();
                              const uint8_t minute = now.is_valid()
                                  ? static_cast<uint8_t>(now.minute)
                                  : 0;
      
                              return rc400::build_command(command, value, minute, id(rc400_config_remote), id(rc400_config_fireplace));
                  - delay: 60ms
          else:
            - logger.log:
                level: WARN
                format: "RC400: Command 0x%02X, value %d invalid or blocked during Seek"
                args: ['command', 'value']

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(rc400_seek_active)) return;
          const uint32_t elapsed = (uint32_t)(millis() - id(rc400_seek_channel_started));
          if (id(rc400_seek_phase) == 2) {
            if (elapsed < 60000U) return;
            id(rc400_seek_active) = false;
            id(rc400_seek_phase) = 0;
            id(sx126x_1)->set_frequency(static_cast<uint32_t>(${rc400_frequency_hz}));
            id(sx126x_1)->configure();
            id(sx126x_1)->set_mode_rx();
            id(rc400_seek_status).publish_state("Complete - remote not discovered");
            ESP_LOGI("rc400_seek", "Remote discovery timed out; restored receiver");
            return;
          }
          if (elapsed < 5000U) return;
          if (id(rc400_seek_channel) >= 30) {
            if (id(rc400_seek_found_fireplace) &&
                !id(rc400_seek_remote_addr).empty()) {
              id(rc400_seek_active) = false;
              id(rc400_seek_phase) = 0;
              id(sx126x_1)->set_frequency(static_cast<uint32_t>(${rc400_frequency_hz}));
              id(sx126x_1)->configure();
              id(sx126x_1)->set_mode_rx();
              id(rc400_seek_status).publish_state("Complete - remote found");
            } else if (id(rc400_seek_found_fireplace)) {
              id(rc400_seek_phase) = 2;
              id(rc400_seek_channel) = id(rc400_seek_best_channel);
              const uint32_t freq = 912000000UL + 200000UL * id(rc400_seek_best_channel);
              id(sx126x_1)->set_frequency(freq);
              id(sx126x_1)->configure();
              id(sx126x_1)->set_mode_rx();
              id(rc400_seek_channel_started) = millis();
              id(rc400_seek_status).publish_state("Waiting for remote - press a button");
              ESP_LOGI("rc400_seek", "Fireplace %s on channel %d; press physical remote now (60s)",
                       id(rc400_seek_fireplace_addr).c_str(), id(rc400_seek_best_channel));
            } else {
              id(rc400_seek_active) = false;
              id(rc400_seek_phase) = 0;
              id(sx126x_1)->set_frequency(static_cast<uint32_t>(${rc400_frequency_hz}));
              id(sx126x_1)->configure();
              id(sx126x_1)->set_mode_rx();
              id(rc400_seek_status).publish_state("Complete - no fireplace found");
              ESP_LOGW("rc400_seek", "No valid fireplace status packets found");
            }
            return;
          }
          ++id(rc400_seek_channel);
          const int ch = id(rc400_seek_channel);
          const uint32_t freq = 912000000UL + 200000UL * ch;
          id(sx126x_1)->set_frequency(freq);
          id(sx126x_1)->configure();
          id(sx126x_1)->set_mode_rx();
          id(rc400_seek_channel_started) = millis();
          char status[48];
          snprintf(status, sizeof(status), "Scanning channel %d of 30", ch);
          id(rc400_seek_status).publish_state(status);
          ESP_LOGI("rc400_seek", "Scanning channel %d: %.1f MHz", ch, freq / 1000000.0f);

  - interval: 5s
    then:
      - lambda: |-
          if (id(rc400_seek_active)) return;
          const bool fresh =
              id(rc400_last_broadcast_ms) != 0 &&
              (uint32_t)(millis() -
              id(rc400_last_broadcast_ms)) < 15000;

          const bool was_receiving =
              id(rc400_receiving).has_state() && id(rc400_receiving).state;
          if (!id(rc400_receiving).has_state() || was_receiving != fresh)
            id(rc400_receiving).publish_state(fresh);

          if (!fresh && was_receiving) {
            id(rc400_flame).publish_state(NAN);
            id(rc400_fan).publish_state(NAN);
            id(rc400_timer).publish_state(NAN);
            id(rc400_operating_raw).publish_state(NAN);
            id(rc400_rssi).publish_state(NAN);
            id(rc400_hot).invalidate_state();
            id(rc400_fireplace_status).invalidate_state();
            id(rc400_timer_is_set).invalidate_state();
            id(rc400_fan_waiting).invalidate_state();
            id(rc400_fan_running).invalidate_state();
            id(rc400_fan_running_state) = -1;
            id(rc400_fan_cooldown_complete) = false;

          }


  # The physical RC400 reports room temperature by RF. Only send our
  # substitute report when the external source is selected.
  - interval: 4min
    then:
      - if:
          condition:
            lambda: |-
              return !id(rc400_seek_active) &&
                     id(rc400_temperature_source).current_option() == "External Sensor" &&
                     id(rc400_external_temperature).has_state() &&
                     !isnan(id(rc400_external_temperature).state);
          then:
            - script.execute:
                id: rc400_send_command
                command: 0x26
                value: !lambda |-
                  return static_cast<int>(lroundf(id(rc400_external_temperature).state));
