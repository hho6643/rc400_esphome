# Board: XIAO ESP32S# & Wio-SX1262 Kit from Seeed Studio, SKU #113110064

esphome:
  name: rc400-receiver
  friendly_name: RC400 Receiver
  area: Kitchen


esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "jk2iJaK1zPyyVmYqzcOvltQup3K2pTvHX/pTahYKb78="

ota:
  - platform: esphome
    encryption:
    id: ota_esphome_1  
    
api:
  encryption:
    key: !secret rc400_receiver__encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: rc400_last_broadcast_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

button:
  - platform: template
    name: "Fireplace Power"
    id: rc400_power_button
    icon: mdi:power
    on_press:
      - if:
          condition:
            lambda: |-
              return id(rc400_receiving).state &&
                     id(rc400_fireplace_status).has_state();
          then:
            - if:
                condition:
                  lambda: |-
                    return id(rc400_fireplace_status).state;
                then:
                  - logger.log: "RC400 OFF command selected"
                  - script.execute: rc400_send_off
                else:
                  - logger.log: "RC400 ON command selected"
                  - script.execute: rc400_send_on
          else:
            - logger.log:
                level: WARN
                format: "Cannot toggle: fireplace status unavailable"


sensor:

  - platform: template
    name: "Flame Level"
    id: rc400_flame
    accuracy_decimals: 0

  - platform: template
    name: "Fan Level"
    id: rc400_fan
    accuracy_decimals: 0

  - platform: template
    name: "Thermostat Setpoint"
    id: rc400_setpoint
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  - platform: template
    name: "Remote Room Temperature"
    id: rc400_remote_room_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Timer Remaining"
    id: rc400_timer
    unit_of_measurement: "min"
    accuracy_decimals: 0

  - platform: template
    name: "Operating Status Raw"
    id: rc400_operating_raw
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "RSSI"
    id: rc400_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    accuracy_decimals: 1

binary_sensor:
  - platform: template
    name: "Cold Climate Pilot"
    id: rc400_cold_climate

  - platform: template
    name: "Fireplace Status"
    id: rc400_fireplace_status

binary_sensor:
  - platform: template
    name: "Thermostat Status"
    id: rc400_thermostat_status


  - platform: template
    name: "Unit is Hot"
    id: rc400_hot

  - platform: template
    name: "Timer Is Set"
    id: rc400_timer_is_set

  - platform: template
    name: "Receiving Broadcasts"
    id: rc400_receiving

  - platform: template
    name: "Fan Warmup Active"
    id: rc400_fan_warmup

interval:
  - interval: 5s
    then:
      - lambda: |-
          const bool fresh =
              id(rc400_last_broadcast_ms) != 0 &&
              (uint32_t)(millis() -
              id(rc400_last_broadcast_ms)) < 15000;

          id(rc400_receiving).publish_state(fresh);

          if (!fresh) {
            id(rc400_flame).publish_state(NAN);
            id(rc400_fan).publish_state(NAN);
            id(rc400_setpoint).publish_state(NAN);
            id(rc400_timer).publish_state(NAN);
            id(rc400_operating_raw).publish_state(NAN);
            id(rc400_rssi).publish_state(NAN);
            id(rc400_cold_climate).invalidate_state();
            id(rc400_hot).invalidate_state();
            id(rc400_fireplace_status).invalidate_state();
            id(rc400_timer_is_set).invalidate_state();
            id(rc400_fan_warmup).invalidate_state();
            id(rc400_thermostat_status).invalidate_state();
          }

switch:
  - platform: gpio
    id: rc400_antenna_switch
    pin: GPIO38
    restore_mode: ALWAYS_ON
    internal: true  
    
spi:
  - id: spi_1
    clk_pin: GPIO7
    miso_pin: GPIO8
    mosi_pin: GPIO9

sx126x:
  - id: sx126x_1
    spi_id: spi_1
    hw_version: sx1262
    busy_pin: GPIO40
    cs_pin: GPIO41
    dio1_pin: GPIO39
    rst_pin: GPIO42    
   
    modulation: FSK
    frequency: 913.2MHz
    bitrate: 25000
    deviation: 50kHz
    bandwidth: 234_3kHz
  
    sync_value: [0x2D, 0xD4]
    payload_length: 25
    preamble_size: 8
    preamble_detect: 2
  
    crc_enable: false
    whitening_enable: false
    rx_start: true


    # Requires board-specific confirmation:
    rf_switch: false
    tcxo_voltage: 2_4V
    tcxo_delay: 5ms



    on_packet:
      then:
        - lambda: |-
            ESP_LOGI("rc400", "Received %u bytes, RSSI %.1f dBm: %s",
                     (unsigned int) x.size(),
                     rssi,
                     format_hex(x).c_str());