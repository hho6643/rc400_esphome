# I use this in ESP Device Builder to pull from github. Obviously add your own area for where this device lives.
esphome:
  area: Kitchen

# Optional: override package defaults
# substitutions:
#  rc400_external_temperature_entity: sensor.rc400_external_temperature
#  rc400_frequency: "913.2MHz"
#  rc400_frequency_hz: "913200000"
#  rc400_remote_address: "00 00 A1 AF"
#  rc400_fireplace_address: "15 57 FE BD"

packages:
  rc400:
    url: https://github.com/hho6643/rc400_esphome
    ref: main
    files:
      - rc400_esphome.yaml
    refresh: 1hr



